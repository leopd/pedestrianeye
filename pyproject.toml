[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "your-project-name"
version = "0.1.0"
description = "Project using OpenCV and framegrab"
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "opencv-python",
    "framegrab",
]

[tool.setuptools]
packages = ["src"]

# UV doesn't require special configuration in pyproject.toml
# You would use it like: uv pip install -e .
